name: CI

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'  # Visual Studio 2022

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ExplorerTabUtility.sln

      - name: Build
        run: msbuild ExplorerTabUtility.sln /restore:false /p:Configuration=Release /v:minimal
        shell: pwsh

      - name: Test
        run: dotnet test ExplorerTabUtility.Tests/ExplorerTabUtility.Tests.csproj -c Release --no-build -v minimal

      - name: Upload artifacts (net9.0-windows)
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerTabUtility-net9.0-windows
          path: ExplorerTabUtility/bin/Release/net9.0-windows
          if-no-files-found: error

      - name: Upload artifacts (net481)
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerTabUtility-net481
          path: ExplorerTabUtility/bin/Release/net481
          if-no-files-found: error