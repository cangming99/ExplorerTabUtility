# Build, Tag and Draft Release
#
# Manual-only workflow: run it from Actions -> "Build, Tag and Draft Release" -> Run workflow.
# It builds all framework/arch zips (+ installer), creates + pushes the version tag, and
# opens a DRAFT release on that tag with every artifact pre-attached. Publish it from the
# Releases page afterwards (a draft is invisible to the in-app auto-updater).
#
# Tests are intentionally NOT run here - they are covered by ci.yml (PR + manual runs).

name: Build, Tag and Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to use (e.g., v2.5.1 - will be created as a tag)'
        required: true
        type: string
        default: 'v2.5.1'

env:
  PROJECT_NAME: ExplorerTabUtility
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        framework: [ 'net9.0-windows', 'net481' ]
        arch: [ 'x64', 'x86', 'arm64' ]
      fail-fast: true
      max-parallel: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild Environments
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'  # Visual Studio 2022

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Build Project
        run: |
          $outputDir = "../publish/${{ matrix.framework }}/${{ matrix.arch }}"
          msbuild "${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj" /restore /t:Publish /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }} /p:RuntimeIdentifier=win-${{ matrix.arch }} /p:PublishDir=$outputDir /p:DebugType=none
        shell: pwsh

      - name: Zip Artifacts
        id: zip_artifacts
        run: |
          $frameworkName = if ("${{ matrix.framework }}" -eq "net9.0-windows") { "Net9.0_FrameworkDependent" } else { "NetFW4.8.1" }
          $zipName = "${{ env.PROJECT_NAME }}_${{ env.VERSION }}_${{ matrix.arch }}_${frameworkName}.zip"

          # Create a temporary directory with PROJECT_NAME as the root
          $tempDir = "temp-$(New-Guid)"
          New-Item -Path "$tempDir/${{ env.PROJECT_NAME }}" -ItemType Directory -Force | Out-Null

          # Copy published files into PROJECT_NAME subdirectory
          Copy-Item -Path "publish/${{ matrix.framework }}/${{ matrix.arch }}/*" -Destination "$tempDir/${{ env.PROJECT_NAME }}" -Recurse

          # Compress the entire temp directory (includes PROJECT_NAME folder)
          Compress-Archive -Path "$tempDir/*" -DestinationPath $zipName

          # Clean up temporary directory
          Remove-Item -Path $tempDir -Recurse -Force

          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip_artifacts.outputs.zipName }}
          path: ${{ steps.zip_artifacts.outputs.zipName }}

  build-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built zips
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build Installer
        run: |
          # Run Inno Setup Compiler with output directly to artifacts folder
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.VERSION }}" `
            /DSourceDir="..\artifacts" `
            "installers\installer.iss"
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_${{ env.VERSION }}_Setup
          path: artifacts/*.exe

  # Creates + pushes the tag, then opens a DRAFT release on that tag with all
  # artifacts pre-attached, so publishing the release needs no manual uploads.
  create-release:
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push the tag and create the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: pwsh
        run: |
          $tag = "${{ env.VERSION }}"
          git fetch --tags origin
          if (git tag -l "$tag") {
            Write-Host "Tag '$tag' already exists - nothing to create."
          } else {
            git tag "$tag"
            git push origin "$tag"
            Write-Host "Created and pushed tag '$tag'."
          }

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.PROJECT_NAME }} ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: release-artifacts/*