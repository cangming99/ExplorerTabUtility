# Build, Sign and Create Tag
#
# Manual-only workflow: run it from Actions -> "Build, Sign and Create Tag" -> Run workflow.
# It builds all framework/arch zips (+ installer), optionally signs them (only when the
# SIGNPATH_API_TOKEN secret is configured), and creates + pushes the version tag.
# It does NOT create a GitHub Release: turn the tag into a release yourself afterwards
# (Releases -> Draft a new release -> choose tag -> attach artifacts from this run page).
#
# Removing the `push: tags` trigger means pushing a v* tag no longer auto-fires anything.

name: Build, Sign and Create Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to use (e.g., v2.5.0 - will be created as a tag)'
        required: true
        type: string
        default: 'v2.5.0'

env:
  PROJECT_NAME: ExplorerTabUtility
  SIGNPATH_ORG_ID: c35b3bd9-3451-4e24-b4e0-332e901290bf
  SIGNPATH_PROJECT_SLUG: ExplorerTabUtility
  SIGNPATH_POLICY_SLUG: release-signing
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        framework: [ 'net9.0-windows', 'net481' ]
        arch: [ 'x64', 'x86', 'arm64' ]
      fail-fast: true
      max-parallel: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild Environments
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'  # Visual Studio 2022

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Build Project
        run: |
          $outputDir = "../publish/${{ matrix.framework }}/${{ matrix.arch }}"
          msbuild "${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj" /restore /t:Publish /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }} /p:RuntimeIdentifier=win-${{ matrix.arch }} /p:PublishDir=$outputDir /p:DebugType=none
        shell: pwsh

      - name: Zip Artifacts
        id: zip_artifacts
        run: |
          $frameworkName = if ("${{ matrix.framework }}" -eq "net9.0-windows") { "Net9.0_FrameworkDependent" } else { "NetFW4.8.1" }
          $zipName = "${{ env.PROJECT_NAME }}_${{ env.VERSION }}_${{ matrix.arch }}_${frameworkName}.zip"

          # Create a temporary directory with PROJECT_NAME as the root
          $tempDir = "temp-$(New-Guid)"
          New-Item -Path "$tempDir/${{ env.PROJECT_NAME }}" -ItemType Directory -Force | Out-Null

          # Copy published files into PROJECT_NAME subdirectory
          Copy-Item -Path "publish/${{ matrix.framework }}/${{ matrix.arch }}/*" -Destination "$tempDir/${{ env.PROJECT_NAME }}" -Recurse

          # Compress the entire temp directory (includes PROJECT_NAME folder)
          Compress-Archive -Path "$tempDir/*" -DestinationPath $zipName

          # Clean up temporary directory
          Remove-Item -Path $tempDir -Recurse -Force

          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip_artifacts.outputs.zipName }}
          path: ${{ steps.zip_artifacts.outputs.zipName }}

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Run Tests
        shell: pwsh
        run: dotnet test ExplorerTabUtility.Tests/ExplorerTabUtility.Tests.csproj -c Release

  # Signing steps only run when SIGNPATH_API_TOKEN is configured; a fork without
  # the secret simply skips signing and continues with unsigned artifacts.
  # (Secrets cannot be referenced in `if:` directly - they are mapped to a job env var first.)
  sign-artifacts:
    needs: build
    runs-on: ubuntu-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Upload signing bundle to GitHub
        id: upload-unsigned-bundle
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-bundle
          path: ./artifacts/*.zip

      - name: Submit bundle for signing
        id: submit-signing
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: multi-zip
          github-artifact-id: ${{ steps.upload-unsigned-bundle.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-output'
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Upload signed artifacts
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-artifacts
          path: ./signed-output/*.zip

  build-installer:
    needs: sign-artifacts
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download signed zips
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: signed-artifacts
          path: artifacts

      - name: Download unsigned zips
        if: env.SIGNPATH_API_TOKEN == ''
        uses: actions/download-artifact@v4
        with:
          name: unsigned-bundle
          path: artifacts

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build Installer
        run: |
          # Run Inno Setup Compiler with output directly to artifacts folder
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.VERSION }}" `
            /DSourceDir="..\artifacts" `
            "installers\installer.iss"
        shell: pwsh

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_${{ env.VERSION }}_Setup-unsigned
          path: artifacts/*.exe

      - name: Submit installer for signing
        id: submit-installer-signing
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: single-zip-executable
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-installer'
          parameters: |
            version: "${{ env.VERSION }}"

      - name: Upload signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-installer
          path: ./signed-installer/*.exe

  # Only creates + pushes the tag - no GitHub Release is created.
  create-tag:
    needs: [ sign-artifacts, build-installer ]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push the tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: pwsh
        run: |
          $tag = "${{ env.VERSION }}"
          git fetch --tags origin
          if (git tag -l "$tag") {
            Write-Host "Tag '$tag' already exists - nothing to create. Artifacts are on this run page."
          } else {
            git tag "$tag"
            git push origin "$tag"
            Write-Host "Created and pushed tag '$tag'."
          }
          Write-Host "Next step: go to Releases -> Draft a new release, choose tag '$tag', and attach the artifacts from this run."